<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · %sveltekit.error.message%</title>
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<style>
			@font-face {
				font-family: 'Eurostile Next';
				src: url('/fonts/eurostile/eurostile-next-semibold.woff2') format('woff2');
				font-weight: 600;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Eurostile Next';
				src: url('/fonts/eurostile/eurostile-next-bold.woff2') format('woff2');
				font-weight: 700;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Alegreya Sans';
				src: url('/fonts/alegreya/alegreya-sans-regular.woff2') format('woff2');
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			:root {
				--font-display: 'Eurostile Next', 'Square 721 BT', ui-sans-serif, system-ui, sans-serif;
				--font-sans-serif: 'Alegreya Sans', ui-sans-serif, system-ui, sans-serif;
				--color-accent: oklch(51% 0.22 260);
				--color-stone: oklch(55.3% 0.013 58.071);
			}
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			html {
				font-size: 20px;
				scroll-behavior: smooth;
			}
			body {
				font-family: var(--font-sans-serif);
				color: #525252;
				background-color: #ffffff;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
				margin: 0;
			}
			.wrapper {
				display: flex;
				flex-direction: column;
				min-height: 100vh;
				min-height: 100svh;
			}
			.container {
				width: 100%;
				max-width: 48rem;
				margin: 0 auto;
				padding: 0 1.5rem;
				flex-grow: 1;
			}
			.back {
				margin-top: 1.5rem;
				margin-bottom: 3rem;
			}
			.back a {
				font-family: var(--font-display);
				font-size: 0.75rem;
				color: var(--color-stone);
				text-decoration: none;
			}
			.back a:hover {
				color: var(--color-accent);
			}
			.status {
				font-family: var(--font-display);
				font-size: 0.75rem;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--color-stone);
			}
			h1 {
				font-family: var(--font-display);
				font-size: 1.75rem;
				font-weight: 700;
				letter-spacing: -0.03em;
				color: #171717;
				margin-top: 0.5rem;
			}
			p {
				margin-top: 1rem;
				font-size: 1rem;
				color: #525252;
			}
			.links {
				margin-top: 2rem;
				display: flex;
				align-items: center;
				gap: 1.5rem;
				font-size: 0.875rem;
			}
			.links a.home {
				color: var(--color-accent);
				text-decoration: none;
				text-underline-offset: 4px;
			}
			.links a.home:hover {
				text-decoration: underline;
			}
			.links a.github {
				color: var(--color-stone);
				text-decoration: none;
				text-underline-offset: 4px;
			}
			.links a.github:hover {
				color: var(--color-accent);
				text-decoration: underline;
			}
			.footer {
				width: 100%;
				margin-top: 3rem;
				margin-bottom: 1rem;
				text-align: center;
			}
			.footer span {
				font-size: 0.75rem;
				color: #9ca3af;
			}
		</style>
	</head>
	<body>
		<div class="wrapper">
			<div class="container">
				<div class="back">
					<a href="/">← Back</a>
				</div>
				<main style="max-width: 36rem">
					<div class="status">%sveltekit.status%</div>
					<h1>%sveltekit.error.message%</h1>
					<p>An unexpected error occurred.</p>
					<div class="links">
						<a href="/" class="home">&rarr; home</a>
						<a href="https://github.com/gaodean" class="github">github</a>
					</div>
				</main>
			</div>
			<div class="footer">
				<span>&copy; 2026 Dean Gao</span>
			</div>
		</div>
	</body>
</html>
